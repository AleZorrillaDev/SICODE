<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Portal Corporativo</title>

    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-body">

    <div class="login-card">
        <!-- Icono Flotante -->
        <div class="login-floating-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <form action="/login" method="POST">
            <!-- Usuario -->
            <label class="login-label">Usuario</label>
            <div class="login-input-group">
                <i class="fa-solid fa-user login-input-icon"></i>
                <input type="text" class="login-input" name="username" required>
            </div>

            <!-- Contraseña -->
            <label class="login-label">Contraseña</label>
            <div class="login-input-group">
                <i class="fa-solid fa-lock login-input-icon"></i>
                <input type="password" class="login-input" name="password" required>
            </div>

            <!-- Botón -->
            <button type="submit" class="login-btn">
                Ingresar
            </button>
        </form>
    </div>

</body>

</html>
